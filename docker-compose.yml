services:
  db:
    # CHANGE THIS LINE:
    image: postgis/postgis:16-3.4-alpine
    container_name: ktpc-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ktpch
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Fixed path from your previous snippet

volumes:
  postgres_data:
