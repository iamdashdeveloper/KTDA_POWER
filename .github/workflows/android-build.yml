name: Build & Release Android APK

on:
  push:
    tags:
      - "v*.*.*"   # triggers on version tags like v1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🟢 Node (Capacitor requires >=22)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 📦 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 📦 Install dependencies
      - name: Install dependencies
        run: pnpm install

      # 🔨 Build web app
      - name: Build web app
        run: pnpm --filter field-tool build

      # 🤖 Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ➕ Add Android platform (safe for CI)
      - name: Add Android platform
        run: |
          cd apps/field-tool
          npx cap add android

      # ⚡ Sync Capacitor
      - name: Sync Capacitor
        run: |
          cd apps/field-tool
          npx cap sync android

      # ☕ Setup Java (Gradle 8+ compatible)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      # 🧠 Force Gradle Java config
      - name: Configure Gradle Java
        run: |
          echo "org.gradle.java.home=$JAVA_HOME_21_X64" >> apps/field-tool/android/gradle.properties

      # 🏗️ Build APK
      - name: Build APK
        run: |
          cd apps/field-tool/android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 🔍 Debug APK location (helps if something breaks)
      - name: Locate APK
        run: find . -name "*.apk"

      # 🚀 Create GitHub Release + upload APK (DOWNLOAD BUTTON HERE)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/field-tool/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        