name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🟢 Node (Capacitor requires >=22)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 📦 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 📦 Install dependencies
      - name: Install dependencies
        run: pnpm install

      # 🔨 Build ONLY your field-tool app
      - name: Build web app
        run: pnpm --filter field-tool build

      # 🤖 Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ➕ Add Android platform
      - name: Add Android platform
        run: |
          cd apps/field-tool
          npx cap add android

      # ⚡ Sync Capacitor
      - name: Sync Capacitor
        run: |
          cd apps/field-tool
          npx cap sync android

      # ☕ Setup Java (FIXED → must match Gradle 8+ requirement)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      # 🧠 Ensure Gradle uses correct Java runtime
      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=$JAVA_HOME_24_X64" >> gradle.properties

      # 🏗️ Build APK
      - name: Build APK
        run: |
          cd apps/field-tool/android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 📦 Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: field-tool-apk
          path: apps/field-tool/android/app/build/outputs/apk/debug/app-debug.apks