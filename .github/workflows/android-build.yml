name: Build & Release Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🟢 Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 📦 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 📦 Install dependencies
      - name: Install dependencies
        run: pnpm install

      # 🔨 Build web app
      - name: Build web app
        run: pnpm --filter field-tool build

      # 🤖 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ⚡ Sync Capacitor
      - name: Sync Capacitor
        run: |
          cd apps/field-tool
          npx cap sync android

      # ☕ Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 🧠 Fix Gradle Java
      - name: Configure Gradle Java
        run: |
          echo "org.gradle.java.home=$JAVA_HOME_21_X64" >> apps/field-tool/android/gradle.properties

      # 🏗️ Build APK
      - name: Build APK
        run: |
          cd apps/field-tool/android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 🔍 DEBUG: show where APK actually is
      - name: Locate APK
        run: find . -name "*.apk"

      # 📦 Upload Artifact (THIS is what shows in Actions tab)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: field-tool-apk
          path: "**/app-debug.apk"

      # 🚀 GitHub Release (THIS gives download button)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "**/app-debug.apk"
          generate_release_notes: true